# S6 cross-owner check: call the engine's reusable build from another owner. No Pages here.
name: S6 cross-owner build
on:
  push:
  workflow_dispatch:
permissions: {}
jobs:
  build:
    uses: hangfolio/spike-engine/.github/workflows/build.yml@v1
    permissions:
      contents: read
      pages: read
    with:
      spike-force-upload: true
  check-artifact:
    needs: build
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Download the artifact the called workflow uploaded
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: github-pages
          path: artifact
      - name: List it
        env:
          DEPLOY: ${{ needs.build.outputs.deploy }}
          BUILD_TYPE: ${{ needs.build.outputs.build-type }}
        run: |
          echo "build outputs: deploy=$DEPLOY build-type=$BUILD_TYPE"
          ls -la artifact
          tar -tf artifact/artifact.tar | sort
